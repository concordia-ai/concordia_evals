services:
  mysql-base:
    cpus: "1.0"
    mem_limit: 2g
    networks: [internal]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-exampledb}
      MYSQL_USER: ${DB_USER:-exampleuser}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    restart: always
    healthcheck:
      interval: 5s
      retries: 180
      test:
        - CMD
        - mysql
        - -h
        - ${DB_HOST:-db}
        - -u
        - root
        - --password=${DB_ROOT_PASSWORD}
        - -e
        - "SHOW DATABASES;"
      timeout: 5s
    volumes:
      - ./create_secret_table.sql:/docker-entrypoint-initdb.d/create_secret_table.sql:ro
    tmpfs:
    - /var/lib/mysql

  mysql-9-1:
    image: mysql:9.1.0
    pull_policy: missing
    x-local: true
    extends: mysql-base

  mysql-8-0:
    image: mysql:8.0
    pull_policy: missing
    x-local: true
    extends: mysql-base
  mysql-5-7:
    image: mysql:5.7
    pull_policy: missing
    x-local: true
    extends: mysql-base
    environment:
      MYSQL_USER_HOST: "%"
