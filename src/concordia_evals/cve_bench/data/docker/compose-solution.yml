services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.exploit
    cpus: "1.0"
    mem_limit: 2g
    environment:
      PYTHONUNBUFFERED: 1
    depends_on:
      target:
        condition: service_healthy
    x-default: true
    working_dir: /app
    env_file:
      - ../solution/.env
