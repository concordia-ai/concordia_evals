[project]
name = "concordia-evals"
version = "0.1.0"
description = "Inspect-native evaluations maintained by Concordia AI"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Concordia AI" },
]
keywords = ["inspect", "eval", "concordia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "inspect_ai >= 0.3.287",
    "inspect-evals >= 0.29.0",
    # only load_dataset(..., revision=...) and the datasets.Dataset/Image /
    # concatenate_datasets helpers are used, all of which predate 4.x by far. a
    # high floor here forces an upgrade of datasets (and therefore pyarrow)
    # inside an existing environment that already works.
    "datasets >= 2.19",
    "huggingface-hub >= 1.2.0",
    # pyarrow (pulled in by datasets) refuses numpy 1.x at runtime but declares
    # no numpy requirement, so a resolution can land on pyarrow>=24 + numpy 1.x
    # and then fail at import time. depend on it explicitly.
    "numpy >= 2.0",
    "docker",
    "filelock >= 3.15",
    "openai >= 3.4.0",
    "pandas >= 2.0",
    "platformdirs",
    "pyyaml >= 6.0",
    "beautifulsoup4 >= 4.10.0",
    "jinja2",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/concordia-ai/concordia_evals"
Repository = "https://github.com/concordia-ai/concordia_evals"

[project.entry-points.inspect_ai]
concordia_evals = "concordia_evals._registry"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "D", "NPY", "PLE", "PLR", "PLW"]
ignore = ["E501", "D10", "D212", "D415", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004"]
"src/concordia_evals/cot_control/_reference/**/*" = ["D", "PLR2004"]
# 挑战数据里附带的构建上下文/参考脚本（来自 upstream，不是本仓库的代码）
"src/concordia_evals/cve_bench/data/**/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "inspect_evals",
    "inspect_evals.*",
    "inspect_evals_utils",
    "inspect_evals_utils.*",
    "yaml",
    "filelock",
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true

[tool.setuptools.package-data]
"*" = ["README.md"]
"concordia_evals.bixbench" = ["Dockerfile"]
# 挑战数据（compose 文件按相对路径引用 docker/ evaluations/ metadata/ sandboxes/，
# 所以目录层级必须原样保留）；列表来自 glob，不含隐藏文件，.env 单独列一条。
"concordia_evals.cve_bench" = [
    "data/challenges/*/*",
    "data/challenges/*/*/*",
    "data/challenges/*/*/*/*",
    "data/challenges/*/.env",
    "data/challenges/*/solution/.env",
    "data/challenges/*/target/.htaccess",
    "data/docker/*",
    "data/docker/wordpress/*",
    "data/evaluations/*",
    "data/evaluations/scripts/*",
    "data/metadata/*.yml",
    "data/sandboxes/*/*",
]
"concordia_evals.bountybench" = ["Dockerfile", "kali.sources", "packages.list", "agent_requirements.txt"]
"concordia_evals.exploitbench" = ["build_v8_image.sh", "docker/**/*"]
"concordia_evals.exploitgym" = ["docker/**/*", "templates/**/*"]
"concordia_evals.web_exploit_bench" = ["agent/Dockerfile", "prompts/*.j2"]

[tool.pytest.ini_options]
addopts = "-rA --color=yes -m 'not dataset_download'"
asyncio_mode = "auto"
markers = [
    "dataset_download: tests that download datasets",
    "slow: marks tests that are slow to run; enable with --runslow or RUN_SLOW_TESTS=1",
    "docker: marks tests that pull or build docker images",
]
