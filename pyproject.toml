[project]
name = "concordia-evals"
version = "0.1.0"
description = "Inspect-native evaluations maintained by Concordia AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Concordia AI" },
]
keywords = ["inspect", "eval", "concordia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "inspect-ai>=0.3.261",
    "datasets >= 4.8.5",
    "huggingface-hub >= 1.2.0",
    "docker",
    "platformdirs",
    "openai>=3.4",
    "inspect-swe>=0.2.72",
    "tomli>=2.4.1 ; python_full_version < '3.11'",
    "agent-client-protocol>=0.12.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/concordia-ai/concordia_evals"
Repository = "https://github.com/concordia-ai/concordia_evals"

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Vendored third-party files stay byte-identical to upstream.
exclude = ["src/concordia_evals/cybergym_e2e/vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "D", "NPY", "PLE", "PLR", "PLW"]
ignore = ["E501", "D10", "D212", "D415", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tomli", "tomli.*"]
ignore_missing_imports = true

# Vendored upstream file: byte-identical copy, not type-checked.
[[tool.mypy.overrides]]
module = ["concordia_evals.cybergym_e2e.vendor.validate"]
ignore_errors = true

[tool.setuptools.package-data]
"concordia_evals.bixbench" = ["Dockerfile"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "dataset_download: tests that download datasets",
    "docker_smoke: end-to-end pipeline smoke tests requiring docker (slow)",
]
